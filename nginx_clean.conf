events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    upstream django {
        server django:8000;
    }

    # HTTP server for api.yalataxi.live -> HTTPS redirect
    server {
        listen 80;
        server_name api.yalataxi.live;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTP server for yalataxi.live and www -> HTTPS redirect
    server {
        listen 80;
        server_name yalataxi.live www.yalataxi.live;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://yalataxi.live$request_uri;
        }
    }

    # HTTPS server for api.yalataxi.live (API only)
    server {
        listen 443 ssl;
        server_name api.yalataxi.live;

        ssl_certificate /etc/letsencrypt/live/api.yalataxi.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yalataxi.live/privkey.pem;

        location ~ ^/(admin/|auth/|rides/|drivers/|payments/|notifications/|chat/|promotions/|deliveries/|safety/|cities/|features/|intercity/|shifts/|incentives/|referrals/|operations/|locations/|support/|api/) {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location /media/ {
            alias /usr/share/nginx/media/;
            expires 7d;
        }

        location /static/admin/ {
            alias /usr/share/nginx/static/admin/;
            expires 30d;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }

    # HTTPS server for yalataxi.live (website)
    server {
        listen 443 ssl;
        server_name yalataxi.live www.yalataxi.live;

        ssl_certificate /etc/letsencrypt/live/yalataxi.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yalataxi.live/privkey.pem;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /static/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Default server for IP access
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location ~ ^/(admin/|auth/|rides/|drivers/|payments/|notifications/|chat/|promotions/|deliveries/|safety/|cities/|features/|intercity/|shifts/|incentives/|referrals/|operations/|locations/|support/|api/) {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location /static/admin/ {
            alias /usr/share/nginx/static/admin/;
            expires 30d;
        }

        location /media/ {
            alias /usr/share/nginx/media/;
            expires 7d;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
