name: iOS – Yala Delivery

on:
  push:
    tags:
      - 'delivery-v*'        # e.g. delivery-v1.2.0
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload to TestFlight after build?'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: ios-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Archive – Yala Delivery
    runs-on: macos-14
    timeout-minutes: 75

    env:
      APP_DIR: delivery-app
      BUNDLE_ID: com.yala.delivery.mr
      APP_NAME: Yala Delivery
      SCHEME: App
      WORKSPACE: ios/App/App.xcworkspace

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install npm dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --prefer-offline

      - name: Build web assets
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      # delivery-app has no ios/ folder yet — initialise it on the runner
      - name: Capacitor add iOS (first time)
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ${{ env.APP_DIR }}

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_DIR }}/ios/App/Pods
          key: pods-delivery-${{ hashFiles('delivery-app/ios/App/Podfile.lock') }}
          restore-keys: pods-delivery-

      - name: Install CocoaPods
        working-directory: ${{ env.APP_DIR }}/ios/App
        run: pod install --repo-update

      # Patch Info.plist with delivery-specific permissions (camera, location, push)
      - name: Patch Info.plist permissions
        working-directory: ${{ env.APP_DIR }}/ios/App/App
        run: |
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleDisplayName 'Yala Delivery'" Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c \
            "Add :CFBundleDisplayName string 'Yala Delivery'" Info.plist

          /usr/libexec/PlistBuddy -c \
            "Set :NSCameraUsageDescription 'Yala Delivery uses the camera to photograph delivery packages and scan barcodes.'" \
            Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c \
            "Add :NSCameraUsageDescription string 'Yala Delivery uses the camera to photograph delivery packages and scan barcodes.'" \
            Info.plist

          /usr/libexec/PlistBuddy -c \
            "Set :NSLocationWhenInUseUsageDescription 'Yala Delivery uses your location to show nearby delivery tasks and navigate to addresses.'" \
            Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c \
            "Add :NSLocationWhenInUseUsageDescription string 'Yala Delivery uses your location to show nearby delivery tasks and navigate to addresses.'" \
            Info.plist

          /usr/libexec/PlistBuddy -c \
            "Set :NSLocationAlwaysAndWhenInUseUsageDescription 'Yala Delivery uses background location while you are on an active delivery so customers can track progress.'" \
            Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c \
            "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'Yala Delivery uses background location while you are on an active delivery so customers can track progress.'" \
            Info.plist

          /usr/libexec/PlistBuddy -c \
            "Set :NSPhotoLibraryUsageDescription 'Yala Delivery accesses photos when you upload proof of delivery images.'" \
            Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c \
            "Add :NSPhotoLibraryUsageDescription string 'Yala Delivery accesses photos when you upload proof of delivery images.'" \
            Info.plist

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_DELIVERY_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/delivery.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build & archive
        working-directory: ${{ env.APP_DIR }}
        run: |
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/Delivery.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_DELIVERY_PROFILE_NAME }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            MARKETING_VERSION="${{ github.ref_name }}" \
            archive | xcpretty

      - name: Generate ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/DeliveryExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>upload</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>iPhone Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.yala.delivery.mr</key>
                  <string>${{ secrets.IOS_DELIVERY_PROFILE_NAME }}</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>thinning</key>
              <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Delivery.xcarchive" \
            -exportPath "$RUNNER_TEMP/Delivery-ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/DeliveryExportOptions.plist" \
            | xcpretty

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yala-Delivery-${{ github.ref_name }}.ipa
          path: ${{ runner.temp }}/Delivery-ipa/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_testflight == 'true')
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            -o ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file "$(ls $RUNNER_TEMP/Delivery-ipa/*.ipa)" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            || true

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
