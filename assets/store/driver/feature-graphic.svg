<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <!-- Yala Driver Feature Graphic — Google Play Store (1024x500) -->

  <!-- Dark navy gradient background -->
  <defs>
    <linearGradient id="driverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1220"/>
      <stop offset="100%" style="stop-color:#142035"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#driverGrad)"/>

  <!-- Gold accent lines -->
  <rect x="0" y="0" width="1024" height="3" fill="#D4AF37"/>
  <rect x="0" y="497" width="1024" height="3" fill="#D4AF37"/>

  <!-- Gold circle accent -->
  <circle cx="850" cy="250" r="180" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.3"/>
  <circle cx="150" cy="450" r="100" fill="#1A2B3C" opacity="0.5"/>

  <!-- Yala "Y" logo (left side) -->
  <path d="M100 140 L170 260 L240 140 L268 140 L182 285 L182 360 L158 360 L158 285 L72 140 Z" fill="#D4AF37"/>

  <!-- App name -->
  <text x="310" y="220" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF">Yala Driver</text>

  <!-- Tagline -->
  <text x="310" y="280" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#D4AF37">Earn Money. Drive with Yala.</text>

  <!-- Feature bullets -->
  <text x="310" y="340" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" opacity="0.8">💰 Earn up to 80% of every fare</text>
  <text x="310" y="375" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" opacity="0.8">📊 Real-time earnings dashboard</text>
  <text x="310" y="410" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" opacity="0.8">🏆 Level up: Bronze → Elite</text>
  <text x="310" y="445" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" opacity="0.8">🇲🇷 Drive across Mauritania</text>

  <!-- Phone mockup (right side) -->
  <rect x="720" y="60" width="220" height="380" rx="24" fill="#1A2B3C"/>
  <rect x="732" y="80" width="196" height="340" rx="8" fill="#0D1A2A"/>
  <!-- Dashboard inside phone -->
  <rect x="740" y="90" width="180" height="60" rx="8" fill="#142035"/>
  <text x="750" y="115" font-family="Arial, sans-serif" font-size="10" fill="#AAA">Today's Earnings</text>
  <text x="750" y="138" font-family="Arial, sans-serif" font-size="22" fill="#D4AF37" font-weight="bold">2,450 MRU</text>
  <!-- Online toggle -->
  <rect x="740" y="165" width="180" height="45" rx="22" fill="#00A651"/>
  <text x="830" y="193" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">🟢 ONLINE</text>
  <!-- Ride request card -->
  <rect x="740" y="225" width="180" height="80" rx="8" fill="#1A2B3C" stroke="#D4AF37" stroke-width="1"/>
  <text x="750" y="248" font-family="Arial, sans-serif" font-size="11" fill="#D4AF37" font-weight="bold">New Ride Request</text>
  <text x="750" y="268" font-family="Arial, sans-serif" font-size="10" fill="#CCC">Tevragh Zeina → Ksar</text>
  <text x="750" y="288" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">350 MRU • 4.2 km</text>
  <!-- Level badge -->
  <rect x="740" y="320" width="180" height="40" rx="6" fill="#142035"/>
  <text x="750" y="344" font-family="Arial, sans-serif" font-size="11" fill="#AAA">Level: </text>
  <text x="790" y="344" font-family="Arial, sans-serif" font-size="11" fill="#D4AF37" font-weight="bold">Gold ★★★</text>
</svg>
