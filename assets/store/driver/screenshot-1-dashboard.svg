<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!-- Yala Driver Screenshot 1: Earnings Dashboard -->

  <rect width="1080" height="1920" fill="#0B1220"/>

  <!-- Status bar -->
  <rect width="1080" height="44" fill="#060B14"/>
  <text x="40" y="32" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">9:41</text>

  <!-- Header -->
  <rect y="44" width="1080" height="80" fill="#0B1220"/>
  <text x="540" y="95" font-family="Arial, sans-serif" font-size="24" fill="#D4AF37" text-anchor="middle" font-weight="bold">Yala Driver</text>

  <!-- Online toggle (large) -->
  <rect x="140" y="160" width="800" height="80" rx="40" fill="#00A651"/>
  <circle cx="860" cy="200" r="30" fill="#FFFFFF"/>
  <text x="460" y="210" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">🟢 YOU'RE ONLINE</text>

  <!-- Today's earnings card -->
  <rect x="40" y="280" width="1000" height="200" rx="16" fill="#142035"/>
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="14" fill="#888">Today's Earnings</text>
  <text x="80" y="380" font-family="Arial, sans-serif" font-size="56" fill="#D4AF37" font-weight="bold">4,250 MRU</text>
  <text x="80" y="420" font-family="Arial, sans-serif" font-size="16" fill="#AAA">12 rides completed</text>
  <!-- Mini chart bars -->
  <rect x="700" y="380" width="30" height="40" rx="4" fill="#D4AF37" opacity="0.4"/>
  <rect x="740" y="360" width="30" height="60" rx="4" fill="#D4AF37" opacity="0.5"/>
  <rect x="780" y="340" width="30" height="80" rx="4" fill="#D4AF37" opacity="0.6"/>
  <rect x="820" y="310" width="30" height="110" rx="4" fill="#D4AF37" opacity="0.8"/>
  <rect x="860" y="290" width="30" height="130" rx="4" fill="#D4AF37"/>
  <rect x="900" y="330" width="30" height="90" rx="4" fill="#D4AF37" opacity="0.7"/>
  <rect x="940" y="350" width="30" height="70" rx="4" fill="#D4AF37" opacity="0.5"/>

  <!-- Stats row -->
  <rect x="40" y="510" width="320" height="110" rx="12" fill="#142035"/>
  <text x="200" y="555" font-family="Arial, sans-serif" font-size="13" fill="#888" text-anchor="middle">This Week</text>
  <text x="200" y="590" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">18,500 MRU</text>

  <rect x="380" y="510" width="320" height="110" rx="12" fill="#142035"/>
  <text x="540" y="555" font-family="Arial, sans-serif" font-size="13" fill="#888" text-anchor="middle">Acceptance</text>
  <text x="540" y="590" font-family="Arial, sans-serif" font-size="24" fill="#00A651" text-anchor="middle" font-weight="bold">92%</text>

  <rect x="720" y="510" width="320" height="110" rx="12" fill="#142035"/>
  <text x="880" y="555" font-family="Arial, sans-serif" font-size="13" fill="#888" text-anchor="middle">Rating</text>
  <text x="880" y="590" font-family="Arial, sans-serif" font-size="24" fill="#D4AF37" text-anchor="middle" font-weight="bold">⭐ 4.9</text>

  <!-- Level badge -->
  <rect x="40" y="650" width="1000" height="80" rx="12" fill="#142035" stroke="#D4AF37" stroke-width="1"/>
  <text x="80" y="698" font-family="Arial, sans-serif" font-size="18" fill="#D4AF37" font-weight="bold">🏆 Gold Driver</text>
  <text x="700" y="698" font-family="Arial, sans-serif" font-size="14" fill="#888">74% to Platinum →</text>
  <!-- Progress bar -->
  <rect x="80" y="710" width="900" height="6" rx="3" fill="#1A2B3C"/>
  <rect x="80" y="710" width="666" height="6" rx="3" fill="#D4AF37"/>

  <!-- Ride request incoming -->
  <rect x="40" y="770" width="1000" height="180" rx="16" fill="#142035" stroke="#D4AF37" stroke-width="2"/>
  <text x="80" y="810" font-family="Arial, sans-serif" font-size="16" fill="#D4AF37" font-weight="bold">🔔 New Ride Request</text>
  <text x="80" y="845" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold">Tevragh Zeina → Sebkha</text>
  <text x="80" y="875" font-family="Arial, sans-serif" font-size="16" fill="#AAA">5.1 km • Regular</text>
  <text x="80" y="910" font-family="Arial, sans-serif" font-size="28" fill="#00A651" font-weight="bold">420 MRU</text>
  <!-- Accept button -->
  <rect x="700" y="860" width="300" height="60" rx="30" fill="#00A651"/>
  <text x="850" y="898" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">ACCEPT</text>

  <!-- Marketing overlay -->
  <rect y="1600" width="1080" height="320" fill="#0B1220" opacity="0.97"/>
  <rect y="1600" width="1080" height="3" fill="#D4AF37"/>
  <text x="540" y="1700" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Earn more. Drive smarter.</text>
  <text x="540" y="1750" font-family="Arial, sans-serif" font-size="22" fill="#D4AF37" text-anchor="middle">80% earnings • Level rewards • Real-time dashboard</text>
</svg>
