<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!-- Yala Driver Screenshot 2: Ride Workflow -->

  <rect width="1080" height="1920" fill="#0B1220"/>
  <rect width="1080" height="44" fill="#060B14"/>

  <!-- Header with active ride indicator -->
  <rect y="44" width="1080" height="80" fill="#142035"/>
  <text x="540" y="95" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Active Ride #1247</text>

  <!-- Map area -->
  <rect y="124" width="1080" height="600" fill="#1A2B3C"/>
  <!-- Route -->
  <path d="M200 400 C400 200, 700 400, 900 300" stroke="#00A651" stroke-width="5" fill="none"/>
  <circle cx="200" cy="400" r="12" fill="#00A651"/>
  <circle cx="900" cy="300" r="12" fill="#D32F2F"/>
  <!-- Car -->
  <rect x="500" y="280" width="50" height="25" rx="6" fill="#D4AF37"/>

  <!-- Rider info card -->
  <rect x="40" y="750" width="1000" height="120" rx="12" fill="#142035"/>
  <circle cx="100" cy="810" r="30" fill="#1A2B3C"/>
  <text x="100" y="818" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">👤</text>
  <text x="150" y="795" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" font-weight="bold">Aminetou S.</text>
  <text x="150" y="820" font-family="Arial, sans-serif" font-size="14" fill="#AAA">Tevragh Zeina → Ksar • 4.2 km</text>
  <text x="150" y="845" font-family="Arial, sans-serif" font-size="16" fill="#D4AF37" font-weight="bold">350 MRU</text>
  <!-- Call/Chat buttons -->
  <rect x="800" y="785" width="100" height="40" rx="8" fill="#1A2B3C" stroke="#D4AF37" stroke-width="1"/>
  <text x="850" y="812" font-family="Arial, sans-serif" font-size="14" fill="#D4AF37" text-anchor="middle">📞 Call</text>

  <!-- Workflow steps -->
  <text x="540" y="920" font-family="Arial, sans-serif" font-size="16" fill="#888" text-anchor="middle">Ride Workflow</text>

  <!-- Step 1: Accept (done) -->
  <rect x="40" y="950" width="1000" height="70" rx="10" fill="#142035"/>
  <circle cx="90" cy="985" r="18" fill="#00A651"/>
  <text x="90" y="992" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">✓</text>
  <text x="130" y="992" font-family="Arial, sans-serif" font-size="16" fill="#00A651" font-weight="bold">Accepted</text>
  <text x="900" y="992" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="end">9:34 AM</text>

  <!-- Step 2: Arrived (done) -->
  <rect x="40" y="1035" width="1000" height="70" rx="10" fill="#142035"/>
  <circle cx="90" cy="1070" r="18" fill="#00A651"/>
  <text x="90" y="1077" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">✓</text>
  <text x="130" y="1077" font-family="Arial, sans-serif" font-size="16" fill="#00A651" font-weight="bold">Arrived at pickup</text>
  <text x="900" y="1077" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="end">9:41 AM</text>

  <!-- Step 3: Start (current) -->
  <rect x="40" y="1120" width="1000" height="70" rx="10" fill="#1A2B3C" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="90" cy="1155" r="18" fill="#D4AF37"/>
  <text x="90" y="1162" font-family="Arial, sans-serif" font-size="14" fill="#0B1220" text-anchor="middle" font-weight="bold">3</text>
  <text x="130" y="1162" font-family="Arial, sans-serif" font-size="16" fill="#D4AF37" font-weight="bold">Start Ride</text>
  <text x="900" y="1162" font-family="Arial, sans-serif" font-size="12" fill="#D4AF37" text-anchor="end">Waiting for PIN...</text>

  <!-- Step 4: Complete (pending) -->
  <rect x="40" y="1205" width="1000" height="70" rx="10" fill="#142035"/>
  <circle cx="90" cy="1240" r="18" fill="#333" stroke="#555" stroke-width="2"/>
  <text x="90" y="1247" font-family="Arial, sans-serif" font-size="14" fill="#888" text-anchor="middle">4</text>
  <text x="130" y="1247" font-family="Arial, sans-serif" font-size="16" fill="#888">Complete Ride</text>

  <!-- PIN entry -->
  <rect x="40" y="1310" width="1000" height="120" rx="12" fill="#142035" stroke="#D4AF37" stroke-width="1"/>
  <text x="540" y="1350" font-family="Arial, sans-serif" font-size="14" fill="#888" text-anchor="middle">Enter rider's PIN to start trip</text>
  <!-- PIN boxes -->
  <rect x="340" y="1370" width="60" height="50" rx="8" fill="#1A2B3C" stroke="#D4AF37" stroke-width="1"/>
  <text x="370" y="1403" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle">4</text>
  <rect x="420" y="1370" width="60" height="50" rx="8" fill="#1A2B3C" stroke="#D4AF37" stroke-width="1"/>
  <text x="450" y="1403" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle">7</text>
  <rect x="500" y="1370" width="60" height="50" rx="8" fill="#1A2B3C" stroke="#D4AF37" stroke-width="1"/>
  <text x="530" y="1403" font-family="Arial, sans-serif" font-size="24" fill="#D4AF37" text-anchor="middle">_</text>
  <rect x="580" y="1370" width="60" height="50" rx="8" fill="#1A2B3C" stroke="#555" stroke-width="1"/>
  <text x="610" y="1403" font-family="Arial, sans-serif" font-size="24" fill="#555" text-anchor="middle">_</text>

  <!-- Marketing overlay -->
  <rect y="1600" width="1080" height="320" fill="#0B1220" opacity="0.97"/>
  <rect y="1600" width="1080" height="3" fill="#D4AF37"/>
  <text x="540" y="1700" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Clear step-by-step workflow</text>
  <text x="540" y="1750" font-family="Arial, sans-serif" font-size="22" fill="#D4AF37" text-anchor="middle">Accept → Arrive → PIN → Start → Complete</text>
</svg>
