resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name yalataxi.live api.yalataxi.live 142.93.99.142;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name yalataxi.live api.yalataxi.live 142.93.99.142;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    client_max_body_size 10M;

    location ^~ /static/admin/ {
        alias /usr/share/nginx/static/admin/;
        expires 30d;
    }

    location ^~ /static/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 7d;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(auth|rides|drivers|payments|notifications|chat|cities|features|intercity|shifts|incentives|promotions|safety|locations|deliveries|admin|media)/ {
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
