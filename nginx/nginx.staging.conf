events {
    worker_connections 2048;
}

http {
    limit_req_status 429;
    limit_conn_status 429;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=600r/m;

    upstream django {
        server django:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name api-staging.yalataxi.live staging.yalataxi.live www.staging.yalataxi.live;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name api-staging.yalataxi.live;

        ssl_certificate /etc/letsencrypt/live/api-staging.yalataxi.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api-staging.yalataxi.live/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location = /admin {
            return 301 https://staging.yalataxi.live/admin;
        }

        client_max_body_size 10M;

        location ~ ^/auth/(login|register|token)/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /media/ {
            alias /usr/share/nginx/media/;
            expires 7d;
        }

        location ~ ^/(admin/|auth/|rides/|drivers/|payments/|notifications/|chat/|promotions/|deliveries/|safety/|cities/|features/|intercity/|shifts/|incentives/|referrals/|operations/|locations/|support/|api/|security/|legal/|merchants/) {
            limit_req zone=api_limit burst=120 nodelay;
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 443 ssl;
        server_name staging.yalataxi.live www.staging.yalataxi.live;

        ssl_certificate /etc/letsencrypt/live/staging.yalataxi.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging.yalataxi.live/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss://staging.yalataxi.live wss://www.staging.yalataxi.live wss://api-staging.yalataxi.live https://api-staging.yalataxi.live;" always;

        client_max_body_size 10M;

        location ~ ^/auth/(login|register|token)/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /media/ {
            alias /usr/share/nginx/media/;
            expires 7d;
        }

        location ~ ^/(auth/|rides/|drivers/|payments/|notifications/|chat/|promotions/|deliveries/|safety/|cities/|features/|intercity/|shifts/|incentives/|referrals/|operations/|locations/|support/|api/|security/|legal/|merchants/) {
            limit_req zone=api_limit burst=120 nodelay;
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location = /sw.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location /static/ {
            root /usr/share/nginx/html;
            expires 7d;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
