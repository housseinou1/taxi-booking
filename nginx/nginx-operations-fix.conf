# Fix for /operations/ routing in nginx.conf
# Add these location blocks to both server blocks (api.yalataxi.live and yalataxi.live)

# Add BEFORE the main API location block (after location /health/)

        # ── Operations endpoints: explicit routing to prevent 404
        location ~ ^/operations/ {
            limit_req zone=api_limit burst=500 nodelay;
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
