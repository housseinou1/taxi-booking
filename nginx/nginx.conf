events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # ── Security headers applied globally ─────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=60r/m;

    upstream django {
        server django:8000;
    }

    server {
        listen 80;
        server_name api.yalataxi.live yalataxi.live www.yalataxi.live;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name api.yalataxi.live;

        ssl_certificate /etc/letsencrypt/live/api.yalataxi.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yalataxi.live/privkey.pem;

        # ── SSL hardening ──────────────────────────────────────────────────────
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # React Admin lives on yalataxi.live — not the API host.
        location = /admin {
            return 301 https://yalataxi.live/admin;
        }

        client_max_body_size 10M;

        # ── Auth endpoints: strict rate limit ──────────────────────────────────
        location ~ ^/auth/(login|register|token)/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Health endpoint: no rate limit ────────────────────────────────────
        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API endpoints ──────────────────────────────────────────────────────
        # Serve uploaded media directly (must win over API regex proxy).
        location ^~ /media/ {
            alias /usr/share/nginx/media/;
            expires 7d;
        }

        location ~ ^/(admin/|auth/|rides/|drivers/|payments/|notifications/|chat/|promotions/|deliveries/|safety/|cities/|features/|intercity/|shifts/|incentives/|referrals/|operations/|locations/|support/|api/|security/|legal/|merchants/) {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── WebSocket ──────────────────────────────────────────────────────────
        location /ws/ {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location /static/admin/ {
            alias /usr/share/nginx/static/admin/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            return 404;
        }
    }

    server {
        listen 443 ssl;
        server_name yalataxi.live www.yalataxi.live;

        ssl_certificate /etc/letsencrypt/live/yalataxi.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yalataxi.live/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss://yalataxi.live wss://www.yalataxi.live wss://api.yalataxi.live https://api.yalataxi.live;" always;

        location ~ ^/auth/(login|register|token)/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy API through same origin so Admin web login avoids cross-subdomain SSL issues.
        # Do NOT proxy /admin/ here — React Admin lives at /admin (SPA).
        # Serve media directly (must win over API regex proxy).
        location ^~ /media/ {
            alias /usr/share/nginx/media/;
            expires 7d;
        }

        location ~ ^/(auth/|rides/|drivers/|payments/|notifications/|chat/|promotions/|deliveries/|safety/|cities/|features/|intercity/|shifts/|incentives/|referrals/|operations/|locations/|support/|api/|security/|legal/|merchants/) {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location = /sw.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location /static/ {
            root /usr/share/nginx/html;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
