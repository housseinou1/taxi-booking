# =============================================================================
#  YALA — Security headers snippet
# =============================================================================
#  WHY THIS FILE EXISTS
#  ---------------------------------------------------------------------------
#  nginx `add_header` does NOT merge across levels. If a `location` block
#  declares ANY `add_header`, it REPLACES every `add_header` inherited from the
#  parent `server`/`http` block — silently.
#
#  In nginx.conf the following locations each declare their own add_header:
#      139  location /static/admin/   { add_header Cache-Control ... }
#      212  location = /index.html    { add_header Cache-Control ... }
#      217  location = /sw.js         { add_header Cache-Control ... }
#      223  location /static/         { add_header Cache-Control ... }
#
#  `location /` serves the SPA via `try_files ... /index.html`, which performs
#  an INTERNAL REDIRECT into `location = /index.html`. That is why
#  `curl -I https://yalataxi.live` returns `Cache-Control: no-cache` but
#  ZERO security headers, while api.yalataxi.live (whose locations do not
#  declare add_header) correctly returns HSTS.
#
#  THE FIX
#  ---------------------------------------------------------------------------
#  Include this file inside EVERY location that declares its own add_header.
#  Locations that declare none keep inheriting from the server block.
#
#      location = /index.html {
#          add_header Cache-Control "no-cache, no-store, must-revalidate" always;
#          include /etc/nginx/snippets/security-headers.conf;
#      }
#
#  `always` is used everywhere so headers are sent on error responses too
#  (4xx/5xx), not just 2xx/3xx.
# =============================================================================

# -- clickjacking ------------------------------------------------------------
add_header X-Frame-Options "DENY" always;

# -- MIME sniffing -----------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;

# -- legacy XSS filter (harmless; superseded by CSP below) -------------------
add_header X-XSS-Protection "1; mode=block" always;

# -- referrer leakage --------------------------------------------------------
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# -- device feature lockdown ------------------------------------------------
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(self)" always;

# -- force HTTPS for a year, including subdomains ---------------------------
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# -- cross-origin isolation --------------------------------------------------
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
