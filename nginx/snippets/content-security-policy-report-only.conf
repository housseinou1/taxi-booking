# =============================================================================
#  YALA — Content-Security-Policy (REPORT-ONLY)
# =============================================================================
#  Use this FIRST. `Content-Security-Policy-Report-Only` never blocks anything —
#  the browser only logs what WOULD have been blocked. This lets you discover
#  every missing origin on real traffic before enforcing.
#
#  HOW TO USE
#    1. Include this file in the same locations as security-headers.conf.
#    2. Reload nginx.
#    3. Open the site in Chrome DevTools -> Console. Every blocked resource
#       appears as a CSP violation with the exact origin to allow.
#    4. Walk the critical journeys: landing page, login, registration,
#       rider request, driver dashboard, delivery, admin, checkout (Stripe),
#       any map screen (Google Maps / OSM / OSRM), and language switching.
#    5. Add any origin you see to the policy in content-security-policy.conf.
#    6. When the console is clean on all journeys, swap to the enforcing file.
#
#  IMPORTANT: report-only does NOT protect against anything. It is a
#  measurement step, not a security control. Do not leave it on indefinitely.
# =============================================================================

add_header Content-Security-Policy-Report-Only "
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://js.stripe.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com data:;
    img-src 'self' data: blob: https:;
    connect-src 'self'
        https://yalataxi.live
        https://www.yalataxi.live
        https://api.yalataxi.live
        wss://yalataxi.live
        wss://www.yalataxi.live
        wss://api.yalataxi.live
        https://api.stripe.com
        https://router.project-osrm.org;
    frame-src 'self' https://js.stripe.com https://hooks.stripe.com;
    worker-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    frame-ancestors 'none';
" always;
