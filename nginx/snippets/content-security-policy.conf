# =============================================================================
#  YALA — Content-Security-Policy (ENFORCING)
# =============================================================================
#  ⚠️  READ THIS BEFORE ENABLING
#
#  The CSP currently written in nginx.conf (line 159) is INCOMPATIBLE with the
#  application. Enabling it as-is would break, in production:
#
#    1. Google Fonts      -> font-src is absent, so it falls back to
#                            `default-src 'self'` and fonts.gstatic.com is
#                            BLOCKED. The whole site loses Plus Jakarta Sans.
#    2. Font stylesheet   -> style-src lacks https://fonts.googleapis.com
#    3. Stripe payments   -> script-src lacks https://js.stripe.com,
#                            connect-src lacks https://api.stripe.com,
#                            frame-src is absent. Card payments would fail.
#                            (payments/CheckoutForm.js uses useElements)
#    4. Google Maps       -> script-src lacks https://maps.googleapis.com
#                            (maps/GoogleTripMap.js uses useJsApiLoader)
#    5. API calls         -> connect-src lists ONLY https://api.yalataxi.live,
#                            but the bundle calls https://www.yalataxi.live and
#                            https://yalataxi.live too (API_HOSTS array).
#    6. OSRM routing      -> connect-src lacks https://router.project-osrm.org
#
#  Every origin below was derived from the built bundle and the source, not
#  guessed. See .agents/tasks/YALA-NGINX-SECURITY-HEADERS.md for the evidence.
#
#  DEPLOY IN TWO STEPS — never go straight to enforcing:
#     Step 1  csp-report-only.conf   (observe, collect violations, no breakage)
#     Step 2  csp-enforce.conf       (this file) once Step 1 is clean
# =============================================================================

# default-src is the fallback for anything not listed below
add_header Content-Security-Policy "
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://js.stripe.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com data:;
    img-src 'self' data: blob: https:;
    connect-src 'self'
        https://yalataxi.live
        https://www.yalataxi.live
        https://api.yalataxi.live
        wss://yalataxi.live
        wss://www.yalataxi.live
        wss://api.yalataxi.live
        https://api.stripe.com
        https://router.project-osrm.org;
    frame-src 'self' https://js.stripe.com https://hooks.stripe.com;
    worker-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    frame-ancestors 'none';
    upgrade-insecure-requests;
" always;

# -----------------------------------------------------------------------------
#  NOTES
# -----------------------------------------------------------------------------
#  'unsafe-inline' in script-src
#      Kept for the first enforcing release so that the change is a pure
#      header fix with no functional risk. It does weaken XSS protection.
#      Once Report-Only is clean, test a build WITHOUT it: if no violation
#      appears, remove it and XSS defence becomes genuinely strong.
#
#  img-src https:
#      Deliberately broad. Required for OpenStreetMap tiles
#      (https://{s}.tile.openstreetmap.org) and the Leaflet marker images the
#      bundle pulls from https://unpkg.com/leaflet@1.9.4/dist/images/.
#      Narrow to an explicit allow-list once those assets are self-hosted.
#
#  style-src 'unsafe-inline'
#      REQUIRED. Leaflet injects <style> elements and the app sets React
#      `style={{...}}` attributes in many components. Removing it breaks
#      map rendering and inline layout.
#
#  frame-ancestors 'none' duplicates X-Frame-Options: DENY.
#      Both are intentional: XFO covers legacy browsers, frame-ancestors is
#      the modern control and also applies to responses XFO cannot.
#
#  Report endpoint
#      Add `report-uri`/`report-to` only after you have somewhere to receive
#      reports. Sending to a dead endpoint just generates console noise.
# -----------------------------------------------------------------------------
