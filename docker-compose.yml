services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/build:/usr/share/nginx/html
      - ./backend/taxi/staticfiles:/usr/share/nginx/static
      - ./backend/taxi/media:/usr/share/nginx/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    depends_on:
      django:
        condition: service_healthy
    restart: always

  django:
    build:
      context: ./backend/taxi
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 taxi.asgi:application"
    volumes:
      - ./backend/taxi/media:/app/media
    env_file:
      - ./backend/taxi/.env.production
    environment:
      DATABASE_URL: postgres://yala_user:${POSTGRES_PASSWORD}@postgres:5432/yala_db
      # Internal Docker PostgreSQL does not use SSL. Compose pins this so rebuilds
      # do not depend on a correct value in .env.production. Use True only with
      # an external managed DATABASE_URL (see backend/taxi/.env.production.template).
      DATABASE_SSL_REQUIRE: "False"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  django-replica:
    build:
      context: ./backend/taxi
      dockerfile: Dockerfile
    command: daphne -b 0.0.0.0 -p 8000 taxi.asgi:application
    volumes:
      - ./backend/taxi/media:/app/media
    env_file:
      - ./backend/taxi/.env.production
    environment:
      DATABASE_URL: postgres://yala_user:${POSTGRES_PASSWORD}@postgres:5432/yala_db
      DATABASE_SSL_REQUIRE: "False"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    expose:
      - "8000"

  django-replica-2:
    build:
      context: ./backend/taxi
      dockerfile: Dockerfile
    command: daphne -b 0.0.0.0 -p 8000 taxi.asgi:application
    volumes:
      - ./backend/taxi/media:/app/media
    env_file:
      - ./backend/taxi/.env.production
    environment:
      DATABASE_URL: postgres://yala_user:${POSTGRES_PASSWORD}@postgres:5432/yala_db
      DATABASE_SSL_REQUIRE: "False"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    expose:
      - "8000"

  postgres:
    image: postgres:15-alpine
    command: postgres -c max_connections=250
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: yala_db
      POSTGRES_USER: yala_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yala_user -d yala_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: ./backend/taxi
      dockerfile: Dockerfile
    command: sh -c "celery -A taxi.celery worker --loglevel=info --concurrency=4"
    env_file:
      - ./backend/taxi/.env.production
    environment:
      DATABASE_URL: postgres://yala_user:${POSTGRES_PASSWORD}@postgres:5432/yala_db
      DATABASE_SSL_REQUIRE: "False"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "celery -A taxi.celery inspect ping | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  celery-worker-2:
    build:
      context: ./backend/taxi
      dockerfile: Dockerfile
    command: sh -c "celery -A taxi.celery worker --loglevel=info --concurrency=4 -n worker2@%h"
    env_file:
      - ./backend/taxi/.env.production
    environment:
      DATABASE_URL: postgres://yala_user:${POSTGRES_PASSWORD}@postgres:5432/yala_db
      DATABASE_SSL_REQUIRE: "False"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  celery-beat:
    build:
      context: ./backend/taxi
      dockerfile: Dockerfile
    command: sh -c "celery -A taxi.celery beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    env_file:
      - ./backend/taxi/.env.production
    environment:
      DATABASE_URL: postgres://yala_user:${POSTGRES_PASSWORD}@postgres:5432/yala_db
      DATABASE_SSL_REQUIRE: "False"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
  redis_data:
