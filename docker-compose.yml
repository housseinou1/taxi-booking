services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/build:/usr/share/nginx/html
      - ./backend/taxi/staticfiles:/usr/share/nginx/static
      - ./backend/taxi/media:/usr/share/nginx/media
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - django
    restart: always

  django:
    build:
      context: ./backend/taxi
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py bootstrap_yala &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 taxi.asgi:application"
    volumes:
      - ./backend/taxi/media:/app/media
    env_file:
      - ./backend/taxi/.env.production
    depends_on:
      - postgres
      - redis
    restart: always
    expose:
      - "8000"

  postgres:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: yala_db
      POSTGRES_USER: yala_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always
    expose:
      - "6379"

volumes:
  postgres_data:
  redis_data:
